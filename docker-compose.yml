services:
  postgres:
    image: postgres:16-alpine
    container_name: psicologo-db
    environment:
      POSTGRES_DB: psicologo
      POSTGRES_USER: psicologo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psicologo_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psicologo"]
      interval: 5s
      timeout: 5s
      retries: 5

  psicologo-api:
    build:
      context: .
      target: api
    image: psicologo:api
    container_name: psicologo-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATA_DIR: /data
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://psicologo:psicologo_secret@postgres:5432/psicologo}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - psicologo_data:/data
    restart: unless-stopped

  psicologo:
    build:
      context: .
      target: production
    image: psicologo:latest
    container_name: psicologo-app
    depends_on:
      - psicologo-api
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

  psicologo-dev:
    profiles: [dev]
    build:
      context: .
      target: development
    image: psicologo:dev
    container_name: psicologo-dev
    depends_on:
      - psicologo-api
    ports:
      - "${DEV_PORT:-4200}:4200"
    volumes:
      - .:/app
      - psicologo_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: ["pnpm", "exec", "ng", "serve", "--host", "0.0.0.0", "--port", "4200", "--poll", "2000", "--proxy-config", "proxy.docker.conf.json"]

volumes:
  psicologo_node_modules:
  psicologo_data:
  postgres_data:
